name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    lint:
        name: Lint & Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: package-lock.json
            - run: npm ci
            - run: npm audit --audit-level=high
            - run: npx eslint .
            - run: npx prettier --check .

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        strategy:
            matrix:
                package: [frontend, worker]
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: ${{ matrix.package }}/package-lock.json
            - run: cd ${{ matrix.package }} && npm ci
            - run: cd ${{ matrix.package }} && npm audit --audit-level=high
            - run: cd ${{ matrix.package }} && npx tsc --noEmit

    test:
        name: Unit Tests (${{ matrix.package }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                package: [worker, frontend]
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: ${{ matrix.package }}/package-lock.json
            - run: cd ${{ matrix.package }} && npm ci
            - run: cd ${{ matrix.package }} && npx vitest run --reporter=verbose

    toolchain:
        name: Toolchain Smoke (${{ matrix.package }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                package: [frontend, worker]
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: ${{ matrix.package }}/package-lock.json
            - run: cd ${{ matrix.package }} && npm ci
            - name: Build frontend and load Wrangler Pages command
              if: matrix.package == 'frontend'
              run: cd frontend && npm run build && npx wrangler pages deploy --help > /dev/null
            - name: Load Wrangler Worker deploy command
              if: matrix.package == 'worker'
              run: cd worker && npx wrangler deploy --help > /dev/null

    cli:
        name: CLI Package
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: cli/package-lock.json
            - name: Install CLI package metadata
              working-directory: cli
              run: npm ci
            - name: Audit CLI package metadata
              working-directory: cli
              run: npm audit --audit-level=high
            - name: Run CLI tests and syntax checks
              working-directory: cli
              run: npm run check
            - name: Validate publish allowlist
              working-directory: cli
              run: |
                  npm pack --dry-run --json > "$RUNNER_TEMP/nipun-pack.json"
                  node --input-type=module <<'NODE'
                  import { readFileSync } from 'node:fs';
                  const report = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/nipun-pack.json', 'utf8'))[0];
                  const files = report.files.map((entry) => entry.path).sort();
                  const required = ['README.md', 'bin/nipun-ai.js', 'lib/cli.js', 'package.json'];
                  for (const path of required) {
                    if (!files.includes(path)) throw new Error(`Missing required package file: ${path}`);
                  }
                  const forbidden = files.filter((path) => /(^|\/)(test|tests|\.env|\.github)(\/|$)|\.(pem|key|p12|pfx)$/i.test(path));
                  if (forbidden.length) throw new Error(`Forbidden files in npm package: ${forbidden.join(', ')}`);
                  NODE
            - name: Smoke test packed CLI commands
              working-directory: cli
              run: |
                  PACKAGE_FILE=$(npm pack --silent)
                  SMOKE_DIR="$RUNNER_TEMP/nipun-cli-smoke"
                  mkdir -p "$SMOKE_DIR"
                  cd "$SMOKE_DIR"
                  npm init -y >/dev/null
                  npm install "$GITHUB_WORKSPACE/cli/$PACKAGE_FILE" --ignore-scripts --no-audit --no-fund
                  EXPECTED=$(node -p "require('$GITHUB_WORKSPACE/cli/package.json').version")
                  ACTUAL=$(./node_modules/.bin/nipun-ai --version)
                  test "$ACTUAL" = "$EXPECTED"
                  ./node_modules/.bin/nipun-ai --doctor

    cli-platform:
        name: CLI Platform Smoke (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        defaults:
            run:
                working-directory: cli
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: cli/package-lock.json
            - run: npm ci
            - run: npm test
            - run: node bin/nipun-ai.js --version
            - run: node bin/nipun-ai.js --doctor
