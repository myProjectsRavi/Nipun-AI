name: Worker toolchain lockfile refresh

on:
  push:
    branches: [chore/worker-toolchain-v5]

permissions:
  contents: write

jobs:
  refresh:
    name: Generate and validate worker lockfile
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/worker-toolchain-v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Generate lockfile with npm resolver
        working-directory: worker
        run: npm install --package-lock-only
      - name: Clean install
        working-directory: worker
        run: npm ci
      - name: Type check
        working-directory: worker
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: worker
        run: npx vitest run --reporter=verbose
      - name: Wrangler deploy command smoke
        working-directory: worker
        run: npx wrangler deploy --help > /dev/null
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- worker/package-lock.json; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/package-lock.json
          git commit -m "chore(deps): refresh worker toolchain lockfile"
          git push origin HEAD:chore/worker-toolchain-v5
