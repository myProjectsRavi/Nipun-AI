name: Finalize release hardening branch

on:
    push:
        branches: [agent/npx-v2-release-hardening]

permissions:
    contents: write

jobs:
    finalize:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: agent/npx-v2-release-hardening
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Apply final integration fixes
              run: |
                  python3 <<'PY'
                  from pathlib import Path
                  import re

                  cli = Path('cli/lib/cli.js')
                  text = cli.read_text()
                  text = text.replace(
                      "export async function runCli(argv = process.argv.slice(2)) {\n",
                      "export async function runCli(argv = process.argv.slice(2)) {\n  const smokeTest = argv.length === 1 && argv[0] === '--smoke-test' && process.env.CI === 'true';\n",
                      1,
                  )
                  text = text.replace(
                      "  if (argv.length > 0) {\n    throw new Error(`Unknown option: ${argv[0]}. Run with --help for supported options.`);\n  }",
                      "  if (argv.length > 0 && !smokeTest) {\n    throw new Error(`Unknown option: ${argv[0]}. Run with --help for supported options.`);\n  }",
                      1,
                  )
                  text = text.replace(
                      "  const workerUrl = `http://127.0.0.1:${workerPort}`;\n  const frontendUrl = `http://127.0.0.1:${frontendPort}`;",
                      "  const workerUrl = `http://localhost:${workerPort}`;\n  const frontendUrl = `http://localhost:${frontendPort}`;",
                      1,
                  )
                  text = text.replace(
                      "  const worker = spawnNpx(['wrangler', 'dev', '--port', String(workerPort)], {",
                      "  const worker = spawnNpx(\n    [\n      'wrangler',\n      'dev',\n      '--port',\n      String(workerPort),\n      '--var',\n      `ALLOWED_ORIGINS:${frontendUrl},https://nipun-ai.pages.dev`,\n    ],\n    {",
                      1,
                  )
                  text = text.replace(
                      "    env: process.env,\n  });\n\n  let frontend;",
                      "      env: process.env,\n    },\n  );\n\n  let frontend;",
                      1,
                  )
                  text = text.replace(
                      "  openBrowser(frontendUrl);",
                      "  if (smokeTest) {\n    cleanup();\n    log(colors.green('✅ End-to-end CLI smoke test passed.'));\n    return;\n  }\n\n  openBrowser(frontendUrl);",
                      1,
                  )
                  cli.write_text(text)

                  tests = Path('cli/test/cli.test.js')
                  text = tests.read_text()
                  text = text.replace(
                      "    assert.equal(managedRoot('/home/example'), '/home/example/.nipun-ai');\n    assert.equal(releaseInstallDir('2.0.0', '/home/example'), '/home/example/.nipun-ai/releases/2.0.0');",
                      "    const home = join('example-home');\n    assert.equal(managedRoot(home), join(home, '.nipun-ai'));\n    assert.equal(releaseInstallDir('2.0.0', home), join(home, '.nipun-ai', 'releases', '2.0.0'));",
                      1,
                  )
                  tests.write_text(text)

                  bat = Path('setup.bat')
                  text = bat.read_text()
                  text = text.replace('if %ERRORLEVEL% neq 0 (', 'if errorlevel 1 (')
                  text = text.replace('if %ERRORLEVEL% equ 0 (', 'if not errorlevel 1 (')
                  bat.write_text(text)

                  readme = Path('README.md')
                  text = readme.read_text()
                  text = re.sub(r'npx nipun-ai(?!@)', 'npx nipun-ai@latest', text)
                  text = text.replace(
                      '## ⚡ Quick Start (Under 1 Minute)\n',
                      '## ⚡ Quick Start (Under 1 Minute)\n\n> **Requires Node.js 22 or newer.** The launcher uses the exact matching GitHub release and installs it under `~/.nipun-ai/releases/<version>/` using the committed npm lockfiles.\n',
                      1,
                  )
                  text = text.replace(
                      '**That\'s it.** Browser opens automatically. Click **Manage Keys** → try **Demo Mode** for instant preview, or enter your free API keys for real-time live analysis.\n',
                      '**That\'s it.** Browser opens automatically. Click **Manage Keys** → try **Demo Mode** for instant preview, or enter your free API keys for real-time live analysis.\n\n> **Deterministic and update-safe:** each npm CLI version maps to the matching `v<version>` GitHub release. Existing releases are cached and verified before reuse; a newer npm version installs into its own versioned directory instead of overwriting a developer checkout.\n',
                      1,
                  )
                  readme.write_text(text)
                  PY

            - name: Install root tooling and format tracked text changes
              run: |
                  npm ci
                  npx prettier --write \
                    cli/bin/nipun-ai.js \
                    cli/lib/cli.js \
                    cli/test/cli.test.js \
                    cli/package.json \
                    cli/package-lock.json \
                    cli/README.md \
                    README.md \
                    CONTRIBUTING.md \
                    .github/workflows/ci.yml \
                    .github/workflows/publish-npm.yml \
                    .github/workflows/release-hardening-finalize.yml \
                    .github/ISSUE_TEMPLATE/bug_report.yml

            - name: Validate branch before committing finalization
              run: |
                  bash -n setup.sh
                  npx eslint .
                  npx prettier --check .
                  cd cli
                  npm ci
                  npm audit --audit-level=high
                  npm run check
                  cd ..
                  git diff --check -- \
                    README.md \
                    CONTRIBUTING.md \
                    setup.bat \
                    cli \
                    .github/workflows/ci.yml \
                    .github/workflows/publish-npm.yml \
                    .github/workflows/release-hardening-finalize.yml \
                    .github/ISSUE_TEMPLATE/bug_report.yml

            - name: Commit final integration fixes
              run: |
                  if git diff --quiet -- \
                    README.md \
                    CONTRIBUTING.md \
                    setup.bat \
                    cli \
                    .github/workflows/ci.yml \
                    .github/workflows/publish-npm.yml \
                    .github/workflows/release-hardening-finalize.yml \
                    .github/ISSUE_TEMPLATE/bug_report.yml; then
                    echo "No final integration changes were needed."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add \
                    cli/bin/nipun-ai.js \
                    cli/lib/cli.js \
                    cli/test/cli.test.js \
                    cli/package.json \
                    cli/package-lock.json \
                    cli/README.md \
                    README.md \
                    CONTRIBUTING.md \
                    setup.bat \
                    .github/workflows/ci.yml \
                    .github/workflows/publish-npm.yml \
                    .github/workflows/release-hardening-finalize.yml \
                    .github/ISSUE_TEMPLATE/bug_report.yml
                  git commit -m "chore(release): finalize npx v2 hardening"
                  git push origin HEAD:agent/npx-v2-release-hardening
